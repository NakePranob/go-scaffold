<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00ADD8"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#F8FAFC"/>
  <text x="70" y="62" fill="#0F172A" font-size="32" font-weight="750" letter-spacing="-0.8">Hexagonal modules</text>
  <text x="72" y="94" fill="#475569" font-size="18">Dependencies point inward. One shape for every module.</text>

  <rect x="70" y="160" width="230" height="96" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="94" y="196" fill="#0F172A" font-size="21" font-weight="700">HTTP / worker</text>
  <text x="94" y="224" fill="#475569" font-size="14">inbound adapters</text>

  <rect x="370" y="160" width="230" height="96" rx="14" fill="#FFFFFF" stroke="#00ADD8" stroke-width="2"/>
  <text x="394" y="196" fill="#0F172A" font-size="21" font-weight="700">application</text>
  <text x="394" y="224" fill="#475569" font-size="14">use cases and workflow</text>

  <rect x="670" y="120" width="230" height="86" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="694" y="156" fill="#0F172A" font-size="21" font-weight="700">domain</text>
  <text x="694" y="182" fill="#475569" font-size="14">business rules</text>

  <rect x="670" y="236" width="230" height="86" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="694" y="272" fill="#0F172A" font-size="21" font-weight="700">ports</text>
  <text x="694" y="298" fill="#475569" font-size="14">interfaces the core needs</text>

  <rect x="960" y="160" width="180" height="120" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="984" y="196" fill="#0F172A" font-size="20" font-weight="700">Postgres</text>
  <text x="984" y="222" fill="#475569" font-size="14">queue, mail,</text>
  <text x="984" y="242" fill="#475569" font-size="14">other adapters</text>

  <line x1="300" y1="208" x2="362" y2="208" stroke="#00ADD8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M600 208 H635 V163 H662" fill="none" stroke="#00ADD8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M600 208 H635 V279 H662" fill="none" stroke="#00ADD8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="900" y1="279" x2="952" y2="240" stroke="#00ADD8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="70" y="390" width="1070" height="90" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="94" y="426" fill="#0F172A" font-size="20" font-weight="700">internal/shared</text>
  <text x="94" y="454" fill="#475569" font-size="15">config, database, HTTP, middleware, errors — shared infrastructure, never business rules</text>

  <text x="70" y="532" fill="#475569" font-size="16">HTTP and worker translate input. The application layer owns the use case.</text>
  <text x="70" y="558" fill="#475569" font-size="16">The domain owns the rules. Ports define what the core needs; adapters provide it.</text>
  <text x="70" y="584" fill="#00ADD8" font-size="13" font-weight="600">go-scaffold check keeps those directions honest.</text>
</svg>
